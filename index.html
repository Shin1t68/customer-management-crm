<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>顧客管理アプリ — ひとり営業CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-white text-gray-900">

  <!-- ヘッダ: アプリ名＋ビュー切替タブ -->
  <header class="border-b border-gray-200 px-6 py-3 flex items-center gap-6">
    <h1 class="text-lg font-bold">顧客管理アプリ</h1>
    <nav class="flex gap-1">
      <button id="tab-customers"
        class="px-4 py-1.5 rounded-lg text-sm font-medium transition-colors">顧客</button>
      <button id="tab-pipeline"
        class="px-4 py-1.5 rounded-lg text-sm font-medium transition-colors">パイプライン</button>
    </nav>
  </header>

  <main class="h-[calc(100vh-57px)]">

    <!-- ============ ビュー① 顧客（ツーカラム） ============ -->
    <section id="view-customers" class="flex h-full">

      <!-- 左ペイン: 検索＋新規＋顧客リスト（幅340px固定） -->
      <div class="w-[340px] shrink-0 border-r border-gray-200 flex flex-col">
        <div class="p-4 space-y-3 border-b border-gray-200">
          <input id="input-search" type="text" placeholder="会社名・担当者・役職で検索"
            class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]" />
          <button id="btn-new-customer"
            class="w-full px-3 py-2 rounded-lg bg-[color:var(--accent)] text-white text-sm font-medium hover:opacity-90">
            ＋ 新規顧客
          </button>
        </div>
        <div id="customer-list" class="flex-1 overflow-y-auto thin-scroll p-3 space-y-2">
          <!-- 顧客カードを動的生成 -->
        </div>
      </div>

      <!-- 右ペイン: 4モードをDOMとして同時保持し hidden で切替 -->
      <div class="flex-1 overflow-y-auto thin-scroll">

        <!-- モード1: 空状態 -->
        <div id="pane-empty" class="h-full flex items-center justify-center">
          <p class="text-gray-400 text-sm">左から顧客を選んでください</p>
        </div>

        <!-- モード2: 顧客詳細 -->
        <div id="pane-customer-detail" class="hidden p-8 max-w-2xl">
          <div class="flex justify-end gap-2 mb-6">
            <button id="btn-edit"
              class="px-4 py-1.5 rounded-lg border border-gray-300 text-sm font-medium hover:bg-gray-50">編集</button>
            <button id="btn-delete"
              class="px-4 py-1.5 rounded-lg border border-gray-300 text-sm font-medium text-red-600 hover:bg-red-50">削除</button>
          </div>

          <!-- 連絡先ブロック -->
          <h2 id="detail-company" class="text-2xl font-bold mb-1"></h2>
          <p class="text-gray-600 mb-6">
            <span id="detail-contact"></span>
            <span id="detail-title" class="text-gray-400"></span>
          </p>
          <dl class="space-y-2 text-sm mb-8">
            <div class="flex gap-3"><dt class="w-16 text-gray-400 shrink-0">メール</dt><dd id="detail-email"></dd></div>
            <div class="flex gap-3"><dt class="w-16 text-gray-400 shrink-0">電話</dt><dd id="detail-phone"></dd></div>
            <div class="flex gap-3"><dt class="w-16 text-gray-400 shrink-0">メモ</dt><dd id="detail-memo" class="preserve-lines"></dd></div>
          </dl>

          <!-- 商談一覧ブロック -->
          <div class="flex items-center justify-between mb-3 pt-6 border-t border-gray-200">
            <h3 class="font-bold">商談</h3>
            <button id="btn-add-deal"
              class="px-3 py-1.5 rounded-lg bg-[color:var(--accent)] text-white text-xs font-medium hover:opacity-90">
              ＋ 商談を追加
            </button>
          </div>
          <div id="detail-deals" class="space-y-2">
            <!-- 商談行を動的生成 -->
          </div>
        </div>

        <!-- モード3: 顧客フォーム（新規・編集） -->
        <div id="pane-customer-form" class="hidden p-8 max-w-2xl">
          <div class="flex items-center gap-4 mb-6">
            <button id="btn-cancel-customer"
              class="px-4 py-1.5 rounded-lg border border-gray-300 text-sm font-medium hover:bg-gray-50">キャンセル</button>
            <h2 id="customer-form-title" class="text-xl font-bold"></h2>
          </div>
          <div class="space-y-4">
            <div>
              <label class="block text-sm text-gray-600 mb-1">会社名 <span class="text-red-500">*</span></label>
              <input id="input-company" type="text"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">担当者名 <span class="text-red-500">*</span></label>
              <input id="input-contact" type="text"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">役職</label>
              <input id="input-title" type="text"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">メール</label>
              <input id="input-email" type="email"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">電話</label>
              <input id="input-phone" type="text"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">メモ</label>
              <textarea id="input-memo" rows="4"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]"></textarea>
            </div>
            <p id="customer-form-error" class="hidden text-sm text-red-600"></p>
            <button id="btn-save-customer"
              class="px-5 py-2 rounded-lg bg-[color:var(--accent)] text-white text-sm font-medium hover:opacity-90">保存</button>
          </div>
        </div>

        <!-- モード4: 商談フォーム（新規・編集） -->
        <div id="pane-deal-form" class="hidden p-8 max-w-2xl">
          <div class="flex items-center gap-4 mb-2">
            <button id="btn-cancel-deal"
              class="px-4 py-1.5 rounded-lg border border-gray-300 text-sm font-medium hover:bg-gray-50">キャンセル</button>
            <h2 id="deal-form-title" class="text-xl font-bold"></h2>
          </div>
          <p id="deal-form-customer" class="text-sm text-gray-400 mb-6 ml-1"></p>
          <div class="space-y-4">
            <div>
              <label class="block text-sm text-gray-600 mb-1">タイトル <span class="text-red-500">*</span></label>
              <input id="input-deal-title" type="text"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">金額（円）</label>
              <input id="input-deal-amount" type="number" min="0" step="1"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">ステータス</label>
              <select id="input-deal-status"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]">
                <option value="lead">見込み</option>
                <option value="proposal">提案</option>
                <option value="won">成約</option>
              </select>
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">フォローアップメモ</label>
              <textarea id="input-deal-memo" rows="4"
                class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-[color:var(--accent)]"></textarea>
            </div>
            <p id="deal-form-error" class="hidden text-sm text-red-600"></p>
            <div class="flex gap-2">
              <button id="btn-save-deal"
                class="px-5 py-2 rounded-lg bg-[color:var(--accent)] text-white text-sm font-medium hover:opacity-90">保存</button>
              <button id="btn-delete-deal"
                class="hidden px-5 py-2 rounded-lg border border-gray-300 text-sm font-medium text-red-600 hover:bg-red-50">削除</button>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- ============ ビュー② パイプライン（カンバン3列） ============ -->
    <section id="view-pipeline" class="hidden h-full p-6">
      <div class="flex gap-4 h-full">
        <!-- 3列を等幅で配置。中身は動的生成 -->
        <div class="flex-1 flex flex-col bg-gray-50 rounded-lg overflow-hidden" data-status="lead">
          <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
            <span class="font-medium text-sm">見込み</span>
            <span class="text-xs text-gray-400" data-count="lead">0</span>
          </div>
          <div class="flex-1 overflow-y-auto thin-scroll p-3 space-y-2" data-column="lead"></div>
        </div>
        <div class="flex-1 flex flex-col bg-gray-50 rounded-lg overflow-hidden" data-status="proposal">
          <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
            <span class="font-medium text-sm">提案</span>
            <span class="text-xs text-gray-400" data-count="proposal">0</span>
          </div>
          <div class="flex-1 overflow-y-auto thin-scroll p-3 space-y-2" data-column="proposal"></div>
        </div>
        <div class="flex-1 flex flex-col bg-gray-50 rounded-lg overflow-hidden" data-status="won">
          <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
            <span class="font-medium text-sm">成約</span>
            <span class="text-xs text-gray-400" data-count="won">0</span>
          </div>
          <div class="flex-1 overflow-y-auto thin-scroll p-3 space-y-2" data-column="won"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- Vite が @supabase/supabase-js を含めてバンドルする -->
  <script type="module" src="/app.js"></script>
</body>
</html>
